<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nora AI | Kiosco Central</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:#030712; color:#f8fafc; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
    .card { background:#0f172a; border:1px solid #1e293b; border-radius:24px; padding:32px 24px; max-width:380px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.6); }
    .logo-glow { width:80px; height:80px; border-radius:50%; margin:0 auto 20px; background:linear-gradient(135deg, #38bdf8, #818cf8); display:flex; align-items:center; justify-content:center; box-shadow:0 0 25px rgba(56,189,248,0.4); }
    .logo-glow img { width:74px; height:74px; border-radius:50%; object-fit:cover; }
    h1 { font-size:1.4rem; font-weight:800; color:#f8fafc; margin-bottom:6px; letter-spacing:-0.5px; }
    .subtitle { font-size:0.85rem; color:#94a3b8; margin-bottom:24px; }
    .spinner { width:32px; height:32px; border:3px solid rgba(56,189,248,0.2); border-top-color:#38bdf8; border-radius:50%; animation:spin 0.8s linear infinite; margin:16px auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .status-text { font-size:0.9rem; color:#38bdf8; font-weight:600; min-height:24px; }
    .btn-retry { display:none; margin-top:20px; background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; font-weight:700; padding:12px 24px; border-radius:12px; cursor:pointer; width:100%; }
    .btn-retry:active { background:#38bdf8; color:#030712; }
    .footer-brand { margin-top:30px; font-size:0.75rem; color:#475569; letter-spacing:1px; text-transform:uppercase; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-glow">
      <img src="https://nexora-store-app.vercel.app/ota/nora-kiosco/nora-avatar-circle.png" alt="Nora AI" onerror="this.src='/icon-192.png'">
    </div>
    <h1>Nora AI × Kiosco</h1>
    <div class="subtitle">Nexora One Engine • Acceso Remoto Seguro</div>

    <div id="loading-spinner" class="spinner"></div>
    <div id="status-label" class="status-text">Conectando con el Kiosco...</div>

    <button id="retry-btn" class="btn-retry" onclick="conectarKiosco()">🔄 Reintentar Conexión</button>
  </div>

  <div class="footer-brand">Nexora One POS • Conexión Cifrada</div>

  <script>
    const TOPIC = 'nexora-nxo-kiosco-central-2026';

    async function conectarKiosco() {
      const label = document.getElementById('status-label');
      const spinner = document.getElementById('loading-spinner');
      const retryBtn = document.getElementById('retry-btn');

      label.innerText = 'Buscando terminal activa del local...';
      label.style.color = '#38bdf8';
      spinner.style.display = 'block';
      retryBtn.style.display = 'none';

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);
        const res = await fetch('https://ntfy.sh/' + TOPIC + '/json?poll=1', { signal: controller.signal });
        clearTimeout(timeout);

        if (!res.ok) throw new Error('Respuesta HTTP no válida');
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        if (lines.length === 0) throw new Error('Sin conexión activa');

        const lastEntry = JSON.parse(lines[lines.length - 1]);
        let targetUrl = (lastEntry.message || '').trim();

        if (targetUrl && (targetUrl.startsWith('http://') || targetUrl.startsWith('https://'))) {
          label.innerText = '¡Kiosco conectado! Abriendo panel...';
          label.style.color = '#34d399';
          setTimeout(() => {
            window.location.replace(targetUrl);
          }, 350);
          return;
        }
        throw new Error('Enlace no encontrado');
      } catch (err) {
        spinner.style.display = 'none';
        label.innerText = 'El Kiosco está fuera de turno o la PC está apagada en el local.';
        label.style.color = '#f87171';
        retryBtn.style.display = 'block';
      }
    }

    // Inicio instantáneo al tocar la App
    conectarKiosco();
  </script>
</body>
</html>
